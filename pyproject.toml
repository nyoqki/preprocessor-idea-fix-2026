[project]
name = "yasno"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "arq>=0.26",
    "asyncpg>=0.30",
    "certifi>=2025.1",
    "fastapi>=0.120",
    "httpx>=0.28",
    "orjson>=3.10",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.40",
    "structlog>=25.1",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "respx>=0.22",
    "ruff>=0.12",
]

[project.scripts]
yasno = "yasno.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yasno"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "C4", "PTH", "TID"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/yasno/ai/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
markers = ["db: requires a PostgreSQL database"]
